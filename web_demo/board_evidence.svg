<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23485c"/></marker></defs><rect width="1440" height="760" fill="#fff"/><text x="40" y="48" font-family="Times New Roman,DFKai-SB,serif" font-size="29" fill="#163649">Board verification: LED status plus numerical readback</text><text x="40" y="86" font-family="Times New Roman,DFKai-SB,serif" font-size="20" fill="#163649">A14 JTAG / PC path shown here. This figure is an explanation, NOT a photograph or new hardware test.</text><rect x="40" y="180" width="270" height="145" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="56" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">PC Python Golden</text><text x="56" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">load matching matrices</text><text x="56" y="274" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">read all 16 C words / tile</text><text x="56" y="304" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">compare both engines</text><rect x="420" y="180" width="260" height="145" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="436" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">JTAG mailbox</text><text x="436" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">command / response</text><text x="436" y="274" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">SRAM-configured FPGA</text><rect x="810" y="180" width="270" height="145" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="826" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">Dense + CSR engines</text><text x="826" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">results / cycle counts</text><text x="826" y="274" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">MAC transaction counts</text><rect x="810" y="500" width="560" height="130" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="826" y="534" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">LED0 busy | LED1 response ready</text><text x="826" y="564" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">LED2 both results available | LED3 error</text><text x="826" y="594" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">A14 LED2 alone does NOT prove arithmetic PASS</text><polyline points="310,220 420,220" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="204" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">commands</text><polyline points="680,220 810,220" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="687" y="204" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">load / start</text><polyline points="810,285 680,285" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="690" y="312" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">read results</text><polyline points="420,285 310,285" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="318" y="312" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">readback</text><polyline points="550,325 550,565 810,565" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="565" y="546" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">probe status bits</text><text x="40" y="675" font-family="Times New Roman,DFKai-SB,serif" font-size="20" fill="#163649">Owner observed LED1 after reset; LED1 + LED2 after completion. These observations are saved as text, not video.</text><text x="40" y="715" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">Arithmetic evidence: 6 saved runs, 288 tiles, 9,216 output checks against independent Python Golden. No board watts measured.</text></svg>