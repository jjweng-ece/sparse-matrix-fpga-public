<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#23485c"/></marker></defs><rect width="1440" height="720" fill="#fff"/><text x="40" y="48" font-family="Times New Roman,DFKai-SB,serif" font-size="29" fill="#163649">MAC: data path and valid control</text><text x="40" y="86" font-family="Times New Roman,DFKai-SB,serif" font-size="20" fill="#163649">Authored RTL explanation, not a Quartus netlist export. Solid = data; dashed = control.</text><rect x="40" y="180" width="180" height="120" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="56" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">a, b: signed 8-bit</text><text x="56" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">in_valid</text><rect x="290" y="180" width="180" height="120" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="306" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">MULTIPLY</text><text x="306" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">8 x 8 -&gt; 16 bits</text><rect x="540" y="180" width="210" height="120" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="556" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">product_q [15:0]</text><text x="556" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">capture if in_valid</text><rect x="870" y="180" width="180" height="120" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="886" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">ADD [31:0]</text><text x="886" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">acc + sext(q)</text><rect x="1140" y="180" width="250" height="120" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="1156" y="214" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">acc [31:0]</text><text x="1156" y="244" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">update if product_valid</text><polyline points="220,235 290,235" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="470,235 540,235" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="750,235 870,235" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><polyline points="1050,235 1140,235" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="762" y="218" font-family="Times New Roman,DFKai-SB,serif" font-size="17" fill="#163649">sext 16 -&gt; 32</text><polyline points="1265,300 1265,375 960,375 960,300" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1000" y="360" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">previous acc: feedback</text><rect x="540" y="480" width="230" height="110" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="556" y="514" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">product_valid</text><text x="556" y="544" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">D = in_valid</text><rect x="920" y="480" width="230" height="110" rx="7" fill="#eff5f8" stroke="#23485c" stroke-width="2"/><text x="936" y="514" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">out_valid</text><text x="936" y="544" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">D = product_valid</text><polyline points="130,300 130,535 540,535" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="270" y="518" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">in_valid</text><polyline points="770,535 920,535" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><polyline points="655,480 655,420 1360,420 1360,300" fill="none" stroke="#23485c" stroke-width="2.5" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="1010" y="406" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">retire enable</text><text x="40" y="640" font-family="Times New Roman,DFKai-SB,serif" font-size="21" fill="#163649">At edge n: capture product. At edge n+1: accumulate the previous product. Valid zero terms still retire.</text><text x="40" y="682" font-family="Times New Roman,DFKai-SB,serif" font-size="19" fill="#163649">Synchronous reset / load_acc have priority; load_acc flushes pending valid. Source: rtl/gate4/matrix_mac.sv</text></svg>